[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hwpx-hwp-converter"
version = "1.0.0"
description = "Offline Windows HWPX to legacy HWP converter"
authors = [{name = "문영식"}]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "defusedxml>=0.7,<1",
  "olefile>=0.47,<1",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "pyinstaller>=6.10,<7"]

[project.scripts]
hwpx-to-hwp = "hwpx_hwp_app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
